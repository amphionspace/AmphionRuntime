org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 离线 license 公钥（X.509 SubjectPublicKeyInfo DER 的 base64，单行、无换行）。
# 空 = SDK 不武装 license（开发 / 内部构建，TextToSpeechSdk.init / createEngine 不做校验）。
# 正式交付构建必须填入真实公钥；对应私钥用 tools/tts/license/gen_keypair.py 生成，严禁进库。
# 也可改用 -PLITS_TTS_LICENSE_PUBLIC_KEY=... 或环境变量注入，避免公钥进 VCS。
LITS_TTS_LICENSE_PUBLIC_KEY=
