# 本地一键拉起 asr-service + prometheus，便于研发期联调和压测。
#
# 使用：
#   1. 在 model/ 下放好模型文件与 manifest.json（manifest.model_dir 写 /etc/asr-service/model）
#   2. docker compose -f asr/server/deploy/docker-compose.yml up
#   3. http://localhost:9091 查看 Prometheus，http://localhost:9090/metrics 看裸 metrics
#   4. 用 grpcurl / bench 客户端打 localhost:50051

services:
  asr-service:
    image: asr-service:dev
    build:
      context: ../../..
      dockerfile: asr/server/deploy/Dockerfile
    ports:
      - "50051:50051"
      - "9090:9090"
    volumes:
      - ./model:/etc/asr-service/model:ro
      - ./manifest.json:/etc/asr-service/manifest.json:ro
    environment:
      - GLOG_logtostderr=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - asr-service
