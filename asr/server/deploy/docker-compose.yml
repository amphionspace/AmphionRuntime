# 本地一键拉起 asr-service（CPU 推理），便于研发期联调。
# GPU 部署见 docker-compose.gpu.yml（推荐，并发更高）。
#
# 使用：
#   1. 在本目录(asr/server/deploy/)下放好 model/ 与 manifest.json
#      （manifest.model_dir 写容器内路径 /etc/asr-service/model）。
#   2. docker compose -f asr/server/deploy/docker-compose.yml up --build
#   3. 用 grpcurl / bench 客户端打 localhost:50051。
#
# 说明：metrics(prometheus) 默认未编入二进制（需 -DASR_ENABLE_PROMETHEUS=ON 重编），
# 故此处不暴露 9090，也未挂 prometheus。

services:
  asr-service:
    image: asr-service:dev
    build:
      context: ../../..
      dockerfile: asr/server/deploy/Dockerfile
    ports:
      - "50051:50051"
    volumes:
      - ./model:/etc/asr-service/model:ro
      - ./manifest.json:/etc/asr-service/manifest.json:ro
    environment:
      - GLOG_logtostderr=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
