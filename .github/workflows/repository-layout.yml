name: Repository Layout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-layout:
    name: Repository layout
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test repository layout checker
        run: python3 tools/test_check_repository_layout.py -v

      - name: Check repository layout
        run: python3 tools/check_repository_layout.py
