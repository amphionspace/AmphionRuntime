name: Repository Layout

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-layout:
    name: Repository layout
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test repository layout checker
        run: |
          python3 tools/test_check_repository_layout.py -v
          python3 tools/test_check_repository_observability.py -v
          python3 tools/test_check_repository_versions.py -v
          python3 tools/test_public_demo_boundary.py -v
          python3 tools/test_ci_dashboard_workflow.py -v
          python3 tools/ci/test_secure_extract_tar.py -v
          python3 shared/docs/dashboard/test_runner.py -v
          python3 asr/server/bench/test_bench_concurrent.py -v

      - name: Check repository layout
        run: |
          python3 tools/check_repository_layout.py
          python3 tools/check_repository_observability.py

      - name: Check documented SDK versions
        run: python3 tools/check_repository_versions.py

      - name: Test pronunciation report gate
        run: python3 -m unittest discover -s tts/tools/android -p test_check_pronunciation_report.py -v

      - name: Test Git-external asset synchronization
        run: |
          python3 tools/assets/test_sync.py -v
          python3 tools/assets/sync.py list
