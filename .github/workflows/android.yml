name: Android SDK CI

# 触发：
#   - push 到 main（按变更范围运行）/ release/*（始终全量）
#   - 指向 main 的 PR（按变更范围运行）
#   - 推 v* tag（始终完整构建并用于发版）
on:
  push:
    branches: [main, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "26.3.11579264"
  ONNXRT_VERSION: "1.24.3"
  SDK_BUILD_DIR: asr/android
  ANDROID_PLATFORM: android-24
  CMAKE_VERSION: "3.22.1"
  MESON_VERSION: "1.7.0"
  NINJA_VERSION: "1.11.1.4"
  NATIVE_CACHE_MANIFEST: .ci-cache/android-native-arm64-v8a/native-cache-manifest.json

jobs:
  changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      contracts: ${{ steps.filter.outputs.contracts }}
      agc: ${{ steps.filter.outputs.agc }}
      police: ${{ steps.filter.outputs.police }}
    steps:
      - name: Checkout main push for an exact before/after diff
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Decide which CI jobs are required
        id: filter
        uses: actions/github-script@v9
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const WORKFLOW = ".github/workflows/android.yml";
            const flags = ["contracts", "agc", "police", "android"];
            const allRequired = Object.fromEntries(flags.map((name) => [name, true]));

            const contractExactInputs = new Set([
              ".gitmodules",
              WORKFLOW,
              "third_party/sherpa-onnx",
            ]);
            const contractPrefixes = [
              "asr/android/",
              "asr/harmony/",
              "asr/native/",
              "asr/test-fixtures/",
              "asr/tools/",
              "delivery/harmony-dingqiao/",
              "shared/api-spec/",
              "third_party/patches/sherpa-amphion/",
            ];
            const agcExactInputs = new Set([
              WORKFLOW,
              "asr/android/sdk/src/main/java/com/amphion/asr/internal/NativeAgcBackend.kt",
              "asr/android/sdk/src/main/java/com/amphion/asr/internal/StreamingAgcProcessor.kt",
              "asr/harmony/sdk/src/main/cpp/agc_bridge.cpp",
              "asr/harmony/sdk/src/main/ets/com/amphion/asr/NativeAgcBackend.ets",
              "asr/harmony/sdk/src/main/ets/com/amphion/asr/StreamingAgcProcessor.ts",
              "asr/tools/03_build_agc_native.sh",
              "asr/tools/ensure_agc_build_tools.sh",
            ]);
            const policeExactInputs = new Set([
              WORKFLOW,
              "asr/tools/sync_harmony_police_assets.py",
              "asr/tools/test_harmony_police_parity.py",
            ]);
            const policePrefixes = [
              "asr/android/sdk-police/",
              "asr/harmony/sdk-police/",
            ];
            const androidExactInputs = new Set([
              ".gitmodules",
              WORKFLOW,
              "asr/android/build.gradle.kts",
              "asr/android/gradle.properties",
              "asr/android/gradle/libs.versions.toml",
              "asr/android/gradle/wrapper/gradle-wrapper.jar",
              "asr/android/gradle/wrapper/gradle-wrapper.properties",
              "asr/android/gradlew",
              "asr/android/gradlew.bat",
              "asr/android/init_gradle_wrapper.sh",
              "asr/android/settings.gradle.kts",
              "asr/tools/03_build_agc_native.sh",
              "asr/tools/04_build_android_so.sh",
              "asr/tools/05_package_aar_libs.sh",
              "asr/tools/07_sync_kotlin_from_upstream.sh",
              "asr/tools/android_native_cache.py",
              "asr/tools/apply_sherpa_patches.sh",
              "asr/tools/ensure_agc_build_tools.sh",
              "asr/tools/prefetch_sherpa_cmake_deps.sh",
              "third_party/sherpa-onnx",
            ]);
            const androidPrefixes = [
              "asr/android/gradle/",
              "asr/android/sdk/",
              "asr/android/sdk-dingqiao/",
              "asr/android/sdk-police/",
              "asr/native/",
              "third_party/patches/sherpa-amphion/",
            ];

            const matches = (path, exact, prefixes) =>
              exact.has(path) || prefixes.some((prefix) => path.startsWith(prefix));
            const classify = (paths) => {
              if (paths.length > 0 && paths.every((path) => path.endsWith(".md"))) {
                return Object.fromEntries(flags.map((name) => [name, false]));
              }
              return {
                contracts: paths.some((path) =>
                  matches(path, contractExactInputs, contractPrefixes)),
                agc: paths.some((path) =>
                  matches(path, agcExactInputs, ["asr/native/audio-processing/"])),
                police: paths.some((path) =>
                  matches(path, policeExactInputs, policePrefixes)),
                android: paths.some((path) =>
                  matches(path, androidExactInputs, androidPrefixes)),
              };
            };
            const assertClassification = (name, paths, expected) => {
              const actual = classify(paths);
              for (const flag of flags) {
                if (actual[flag] !== Boolean(expected[flag])) {
                  throw new Error(
                    `change classifier self-test ${name} failed for ${flag}: ` +
                    `expected=${Boolean(expected[flag])} actual=${actual[flag]}`,
                  );
                }
              }
            };
            assertClassification("harmony-runtime", [
              "asr/harmony/sdk/src/main/ets/com/amphion/asr/Runtime.ets",
            ], { contracts: true });
            assertClassification("agc-processor", [
              "asr/android/sdk/src/main/java/com/amphion/asr/internal/StreamingAgcProcessor.kt",
            ], { contracts: true, agc: true, android: true });
            assertClassification("harmony-agc-processor", [
              "asr/harmony/sdk/src/main/ets/com/amphion/asr/StreamingAgcProcessor.ts",
            ], { contracts: true, agc: true });
            assertClassification("agc-native", [
              "asr/native/audio-processing/src/amphion_audio_processing.cpp",
            ], { contracts: true, agc: true, android: true });
            assertClassification("agc-report", [
              "asr/android/reports/automatic-agc-evaluation/report.json",
            ], { contracts: true });
            assertClassification("android-sdk", [
              "asr/android/sdk/src/main/java/com/amphion/asr/internal/SessionImpl.kt",
            ], { contracts: true, android: true });
            assertClassification("police-asset", [
              "asr/android/sdk-police/src/main/assets/police_terms/terms_global.fst",
            ], { contracts: true, police: true, android: true });
            assertClassification("markdown", ["asr/android/docs/INTEGRATION.md"], {});
            assertClassification("sample", [
              "asr/android/samples/public-demo/src/main/java/com/amphion/Demo.kt",
            ], { contracts: true });
            assertClassification("android-doc-data", [
              "asr/android/docs/navigation.json",
            ], { contracts: true });
            assertClassification("gradle-config", [
              "asr/android/gradle/verification-metadata.xml",
            ], { contracts: true, android: true });
            assertClassification("unrelated", ["tts/android/sdk/src/main/Foo.kt"], {});
            assertClassification("workflow", [WORKFLOW], allRequired);
            assertClassification("rename-out", [
              "asr/android/sdk/src/main/java/com/amphion/Old.kt",
              "archive/Old.kt",
            ], { contracts: true, android: true });

            const publish = (result, reason) => {
              core.info(`${reason}: ${JSON.stringify(result)}`);
              for (const flag of flags) core.setOutput(flag, String(result[flag]));
            };
            const forceAll = (reason) => publish(allRequired, reason);

            if (context.eventName === "workflow_dispatch" ||
                context.ref.startsWith("refs/tags/v") ||
                context.ref.startsWith("refs/heads/release/")) {
              forceAll("Release, tag, or manual event requires every gate");
              return;
            }

            let paths;
            if (context.eventName === "pull_request") {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100,
              });
              if (files.length < context.payload.pull_request.changed_files) {
                forceAll("Changed-files API was truncated; failing closed");
                return;
              }
              // Check both sides so moving a watched input out of scope still runs its gate.
              paths = files.flatMap((file) =>
                [file.filename, file.previous_filename].filter(Boolean));
            } else if (context.eventName === "push" && context.ref === "refs/heads/main") {
              const before = context.payload.before;
              if (!/^[0-9a-f]{40}$/.test(before) || /^0+$/.test(before)) {
                forceAll("Main push has no usable before revision; failing closed");
                return;
              }
              try {
                execFileSync("git", ["fetch", "--no-tags", "--depth=1", "origin", before], {
                  stdio: "pipe",
                });
                const changed = execFileSync(
                  "git",
                  ["diff", "--name-only", "-z", "--no-renames", before, context.sha],
                  { encoding: "utf8" },
                );
                // --no-renames exposes both the removed and added paths of a rename.
                paths = changed.split("\0").filter(Boolean);
              } catch (error) {
                core.warning(`Cannot classify main push diff: ${error}`);
                forceAll("Main diff failed; failing closed");
                return;
              }
            } else {
              forceAll("Unknown event requires every gate");
              return;
            }
            publish(classify([...new Set(paths)]), "Classified changed paths");

  static-contracts:
    name: Static ASR contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run automatic AGC static release gate
        run: python3 asr/tools/run_automatic_agc_release_gate.py static

      - name: Check customer delivery redaction
        run: |
          python3 -m unittest \
            delivery/harmony-dingqiao/delivery/test_check_customer_delivery_redaction.py -v
          python3 delivery/harmony-dingqiao/delivery/check_customer_delivery_redaction.py \
            delivery/harmony-dingqiao/docs/customer

  harmony-contracts:
    name: Harmony lifecycle contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run cross-platform ASR lifecycle contracts
        run: |
          python3 -m unittest discover -s asr/tools/tests -p 'test_harmony_*.py' -v
          python3 -m unittest \
            asr.tools.tests.test_android_native_cache \
            delivery.harmony-dingqiao.delivery.test_run_device_stress \
            delivery.harmony-dingqiao.delivery.test_run_finish_compat_release_gate \
            delivery.harmony-dingqiao.delivery.test_release_defaults -v

  police-parity:
    name: Police cross-platform parity
    needs: changes
    if: needs.changes.outputs.police == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Fetch frozen police asset source
        shell: bash
        run: |
          source_commit="$(python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          metadata = json.loads(Path(
              "asr/android/sdk-police/src/main/assets/police_terms/terms_global_meta.json"
          ).read_text(encoding="utf-8"))
          source_commit = metadata.get("source_commit", "")
          if re.fullmatch(r"[0-9a-f]{40}", source_commit) is None:
              raise SystemExit("invalid frozen police source_commit")
          print(source_commit)
          PY
          )"
          git fetch --no-tags --depth=1 origin "$source_commit"
          git cat-file -e "$source_commit^{commit}"

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install TypeScript
        run: npm install --global typescript@4.9.5

      - name: Verify synchronized police assets and parity corpus
        run: |
          python3 asr/tools/sync_harmony_police_assets.py --check
          python3 asr/tools/test_harmony_police_parity.py

  host-agc:
    name: Host AGC native tests
    needs: changes
    if: needs.changes.outputs.agc == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore incremental host AGC build
        uses: actions/cache@v5
        with:
          path: |
            asr/native/audio-processing/build-host
            !asr/native/audio-processing/build-host/meson-logs
            asr/native/audio-processing/subprojects
          key: host-agc-${{ runner.os }}-v1-${{ hashFiles('asr/native/audio-processing/meson.build', 'asr/native/audio-processing/subprojects/*.wrap', 'asr/tools/03_build_agc_native.sh', 'asr/tools/ensure_agc_build_tools.sh') }}-${{ hashFiles('asr/native/audio-processing/src/**', 'asr/native/audio-processing/include/**', 'asr/native/audio-processing/tests/**') }}
          restore-keys: |
            host-agc-${{ runner.os }}-v1-${{ hashFiles('asr/native/audio-processing/meson.build', 'asr/native/audio-processing/subprojects/*.wrap', 'asr/tools/03_build_agc_native.sh', 'asr/tools/ensure_agc_build_tools.sh') }}-

      - name: Install AGC native build tools
        run: python3 -m pip install meson==${{ env.MESON_VERSION }} ninja==${{ env.NINJA_VERSION }}

      - name: Build and test host AGC
        run: bash asr/tools/03_build_agc_native.sh host

  android-aar:
    name: Android AAR (arm64-v8a)
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize sherpa-onnx submodule
        run: git submodule update --init third_party/sherpa-onnx

      - name: Compute Android native source fingerprint
        id: native-fingerprint
        run: |
          fingerprint="$(python3 asr/tools/android_native_cache.py fingerprint \
            --abi arm64-v8a \
            --android-platform "${{ env.ANDROID_PLATFORM }}" \
            --cmake-version "${{ env.CMAKE_VERSION }}" \
            --meson-version "${{ env.MESON_VERSION }}" \
            --ndk-version "${{ env.NDK_VERSION }}" \
            --ninja-version "${{ env.NINJA_VERSION }}" \
            --onnxruntime-version "${{ env.ONNXRT_VERSION }}")"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore verified native artifacts
        id: native-cache
        uses: actions/cache@v5
        with:
          path: |
            third_party/sherpa-onnx/build-android-arm64-v8a/install/lib/libsherpa-onnx-jni.so
            third_party/sherpa-onnx/build-android-arm64-v8a/install/lib/libonnxruntime.so
            asr/native/audio-processing/build-android-arm64-v8a/libamphion_audio_processing.so
            ${{ env.NATIVE_CACHE_MANIFEST }}
          key: android-native-${{ runner.os }}-v1-${{ steps.native-fingerprint.outputs.fingerprint }}

      - name: Verify restored native artifact identity
        if: steps.native-cache.outputs.cache-hit == 'true'
        run: |
          python3 asr/tools/android_native_cache.py verify \
            --manifest "${{ env.NATIVE_CACHE_MANIFEST }}" \
            --fingerprint "${{ steps.native-fingerprint.outputs.fingerprint }}" \
            --abi arm64-v8a \
            --android-platform "${{ env.ANDROID_PLATFORM }}" \
            --cmake-version "${{ env.CMAKE_VERSION }}" \
            --meson-version "${{ env.MESON_VERSION }}" \
            --ndk-version "${{ env.NDK_VERSION }}" \
            --ninja-version "${{ env.NINJA_VERSION }}" \
            --onnxruntime-version "${{ env.ONNXRT_VERSION }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install AGC native build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: python3 -m pip install meson==${{ env.MESON_VERSION }} ninja==${{ env.NINJA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Install Android native SDK tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Init Gradle wrapper
        working-directory: ${{ env.SDK_BUILD_DIR }}
        run: bash init_gradle_wrapper.sh

      - name: Select pinned Android build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          echo "$ANDROID_HOME/cmake/${{ env.CMAKE_VERSION }}/bin" >> "$GITHUB_PATH"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Build native .so
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          bash asr/tools/03_build_agc_native.sh android-arm64-v8a
          bash asr/tools/04_build_android_so.sh arm64-v8a

      - name: Record native artifact identity
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          python3 asr/tools/android_native_cache.py create-manifest \
            --manifest "${{ env.NATIVE_CACHE_MANIFEST }}" \
            --fingerprint "${{ steps.native-fingerprint.outputs.fingerprint }}" \
            --abi arm64-v8a \
            --android-platform "${{ env.ANDROID_PLATFORM }}" \
            --cmake-version "${{ env.CMAKE_VERSION }}" \
            --meson-version "${{ env.MESON_VERSION }}" \
            --ndk-version "${{ env.NDK_VERSION }}" \
            --ninja-version "${{ env.NINJA_VERSION }}" \
            --onnxruntime-version "${{ env.ONNXRT_VERSION }}"

      - name: Package .so to jniLibs/
        run: bash asr/tools/05_package_aar_libs.sh

      - name: Configure local.properties
        working-directory: ${{ env.SDK_BUILD_DIR }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Gradle assemble + unit test
        working-directory: ${{ env.SDK_BUILD_DIR }}
        run: |
          ./gradlew --no-daemon \
            :sdk:assembleRelease :sdk:testReleaseUnitTest \
            :sdk-dingqiao:assembleRelease :sdk-dingqiao:testReleaseUnitTest

      - name: Verify AAR contents
        working-directory: ${{ env.SDK_BUILD_DIR }}
        run: |
          AAR=sdk/build/outputs/aar/sdk-release.aar
          [ -f "$AAR" ] || { echo "AAR missing"; exit 1; }
          unzip -l "$AAR" | tee /tmp/aar-contents.txt
          # 必须包含 .so 和 classes.jar
          unzip -l "$AAR" | grep -q 'jni/arm64-v8a/libsherpa-onnx-jni.so'
          unzip -l "$AAR" | grep -q 'jni/arm64-v8a/libonnxruntime.so'
          unzip -l "$AAR" | grep -q 'jni/arm64-v8a/libamphion_audio_processing.so'
          unzip -l "$AAR" | grep -q 'classes.jar'

      - name: Compute SHA256 of AAR
        working-directory: ${{ env.SDK_BUILD_DIR }}
        run: |
          sha256sum sdk/build/outputs/aar/sdk-release.aar | tee sdk/build/outputs/aar/sdk-release.aar.sha256

      - name: Verify Kotlin bridge in sync with submodule
        run: bash asr/tools/07_sync_kotlin_from_upstream.sh --check

      - name: Upload AAR
        uses: actions/upload-artifact@v7
        with:
          name: amphion-runtime-aar-${{ github.sha }}
          path: |
            ${{ env.SDK_BUILD_DIR }}/sdk/build/outputs/aar/sdk-release.aar
            ${{ env.SDK_BUILD_DIR }}/sdk/build/outputs/aar/sdk-release.aar.sha256
          compression-level: 0
          retention-days: 30

      - name: Upload native .so
        uses: actions/upload-artifact@v7
        with:
          name: amphion-runtime-native-arm64-v8a-${{ github.sha }}
          path: |
            third_party/sherpa-onnx/build-android-arm64-v8a/install/lib/libsherpa-onnx-jni.so
            third_party/sherpa-onnx/build-android-arm64-v8a/install/lib/libonnxruntime.so
            asr/native/audio-processing/build-android-arm64-v8a/libamphion_audio_processing.so
          compression-level: 0
          retention-days: 30

  ci-result:
    # Keep the old required-check display name so branch protection remains valid during migration.
    name: Build AAR (arm64-v8a)
    needs: [changes, static-contracts, harmony-contracts, police-parity, host-agc, android-aar]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Verify required Android CI jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTRACTS_REQUIRED: ${{ needs.changes.outputs.contracts }}
          STATIC_RESULT: ${{ needs.static-contracts.result }}
          HARMONY_RESULT: ${{ needs.harmony-contracts.result }}
          POLICE_REQUIRED: ${{ needs.changes.outputs.police }}
          POLICE_RESULT: ${{ needs.police-parity.result }}
          AGC_REQUIRED: ${{ needs.changes.outputs.agc }}
          HOST_AGC_RESULT: ${{ needs.host-agc.result }}
          ANDROID_REQUIRED: ${{ needs.changes.outputs.android }}
          ANDROID_RESULT: ${{ needs.android-aar.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "changes failed: $CHANGES_RESULT"
            exit 1
          fi
          verify_job() {
            local job_name="$1"
            local required="$2"
            local result="$3"
            local expected="skipped"
            [[ "$required" == "true" ]] && expected="success"
            if [[ "$result" != "$expected" ]]; then
              echo "$job_name expected $expected (required=$required), got: $result"
              exit 1
            fi
          }
          verify_job static-contracts "$CONTRACTS_REQUIRED" "$STATIC_RESULT"
          verify_job harmony-contracts "$CONTRACTS_REQUIRED" "$HARMONY_RESULT"
          verify_job police-parity "$POLICE_REQUIRED" "$POLICE_RESULT"
          verify_job host-agc "$AGC_REQUIRED" "$HOST_AGC_RESULT"
          verify_job android-aar "$ANDROID_REQUIRED" "$ANDROID_RESULT"
          echo "Android CI passed (contracts: $STATIC_RESULT/$HARMONY_RESULT, police: $POLICE_RESULT, host-agc: $HOST_AGC_RESULT, android-aar: $ANDROID_RESULT)"

  publish-maven:
    name: Publish to Maven (tags only)
    needs: [android-aar, ci-result]
    if: startsWith(github.ref, 'refs/tags/v') && needs.android-aar.result == 'success' && needs.ci-result.result == 'success'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download AAR + native artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Restage AAR for Gradle publish
        run: |
          mkdir -p ${{ env.SDK_BUILD_DIR }}/sdk/build/outputs/aar
          cp artifacts/amphion-runtime-aar-${{ github.sha }}/sdk-release.aar \
             ${{ env.SDK_BUILD_DIR }}/sdk/build/outputs/aar/sdk-release.aar
          mkdir -p ${{ env.SDK_BUILD_DIR }}/sdk/src/main/jniLibs/arm64-v8a
          find artifacts/amphion-runtime-native-arm64-v8a-${{ github.sha }} \
            -type f -name '*.so' \
            -exec cp {} ${{ env.SDK_BUILD_DIR }}/sdk/src/main/jniLibs/arm64-v8a/ \;

      - name: Publish to local repo (artifact-only verification)
        working-directory: ${{ env.SDK_BUILD_DIR }}
        run: |
          bash init_gradle_wrapper.sh
          ./gradlew --no-daemon :sdk:publishReleasePublicationToLocalFileRepoRepository

      - name: Upload Maven repo snapshot
        uses: actions/upload-artifact@v7
        with:
          name: amphion-runtime-maven-${{ github.ref_name }}
          path: ${{ env.SDK_BUILD_DIR }}/sdk/build/maven-repo
          retention-days: 90

      # 真实推到公司私有 Nexus / Artifactory：把下面的 step 取消注释，并配 secrets
