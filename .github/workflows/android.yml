      #   working-directory: ${{ env.SDK_BUILD_DIR }}
      #   env:
      #     MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      #     MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      #     MAVEN_URL: ${{ secrets.MAVEN_URL }}
      #   run: ./gradlew --no-daemon :sdk:publishReleasePublicationToCorpRepository

