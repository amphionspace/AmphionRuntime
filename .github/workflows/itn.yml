name: ITN rules

on:
  pull_request:
    paths:
      - '.github/workflows/itn.yml'
      - 'asr/tools/*weitn*'
      - 'asr/tools/08_pack*_assets.sh'
      - 'tools/assets/manifest.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/itn.yml'
      - 'asr/tools/*weitn*'
      - 'asr/tools/08_pack*_assets.sh'
      - 'tools/assets/manifest.json'

permissions:
  contents: read

jobs:
  itn-rules:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python3 -m pip install -r asr/tools/requirements-weitn.txt
      - run: python3 -m unittest asr.tools.test_weitn_fsts -v
