name: monthly-asr-dashboard

on:
  schedule:
    # 每月最后一周的周一 UTC 02:00 跑一次（本地大约周一 10:00）
    - cron: "0 2 22-28 * 1"
  workflow_dispatch:
    inputs:
      month:
        description: "Target month (YYYY-MM). Defaults to today's month."
        required: false
        default: ""
      android_aar:
        description: "Android AAR artifact url to download"
        required: false
        default: ""
      ios_xcframework:
        description: "iOS xcframework artifact url to download"
        required: false
        default: ""
      server_image:
        description: "Server docker image used to spin up bench target"
        required: false
        default: ""

jobs:
  monthly-dashboard:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout repo (with sherpa-onnx submodule)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install grpcio grpcio-tools protobuf numpy

      - name: Resolve target month
        id: month
        run: |
          M="${{ github.event.inputs.month }}"
          if [ -z "$M" ]; then
            M=$(date -u +%Y-%m)
          fi
          echo "month=$M" >> "$GITHUB_OUTPUT"
          echo "Target month: $M"

      - name: Pull bench WAVs (used by server bench only)
        env:
          REGRESSION_OSS_URL: ${{ secrets.REGRESSION_OSS_URL }}
        run: |
          if [ -z "$REGRESSION_OSS_URL" ]; then
            echo "[dashboard] REGRESSION_OSS_URL not set, skipping WAV pull";
            exit 0;
          fi
          mkdir -p shared/regression-set/wav
          curl -fL "$REGRESSION_OSS_URL" -o /tmp/wav.tar.gz
          tar xf /tmp/wav.tar.gz -C shared/regression-set/wav

      - name: Pull crash sources
        env:
          ANDROID_CRASH_URL: ${{ secrets.ANDROID_CRASH_JSON_URL }}
          IOS_CRASH_URL: ${{ secrets.IOS_CRASH_JSON_URL }}
        run: |
          mkdir -p build/dashboard
          if [ -n "$ANDROID_CRASH_URL" ]; then
            curl -fL "$ANDROID_CRASH_URL" -o build/dashboard/android-crash.json || true
          fi
          if [ -n "$IOS_CRASH_URL" ]; then
            curl -fL "$IOS_CRASH_URL" -o build/dashboard/ios-crash.json || true
          fi

      - name: Run server bench (CPU only, smoke target)
        env:
          BENCH_TARGET: ${{ secrets.BENCH_TARGET }}
        run: |
          if [ -z "$BENCH_TARGET" ]; then
            echo "[dashboard] BENCH_TARGET not set, skipping server bench";
            exit 0;
          fi
          mkdir -p build/dashboard
          python server/asr-service/bench/bench_concurrent.py \
            --target "$BENCH_TARGET" \
            --regression-set shared/regression-set \
            --json-out build/dashboard/bench.json || true

      - name: Generate monthly dashboard report
        run: |
          set -e
          ANDROID_CRASH_FLAG=""
          if [ -f build/dashboard/android-crash.json ]; then
            ANDROID_CRASH_FLAG="--android-crash-source build/dashboard/android-crash.json"
          fi
          IOS_CRASH_FLAG=""
          if [ -f build/dashboard/ios-crash.json ]; then
            IOS_CRASH_FLAG="--ios-crash-source build/dashboard/ios-crash.json"
          fi
          BENCH_RUNNER_FLAG=""
          if [ -f build/dashboard/bench.json ]; then
            BENCH_RUNNER_FLAG="--bench-runner \"cat build/dashboard/bench.json\""
          fi
          python shared/docs/dashboard/runner.py \
            --month "${{ steps.month.outputs.month }}" \
            --out "shared/docs/dashboard/trends/reports/${{ steps.month.outputs.month }}.md" \
            $ANDROID_CRASH_FLAG \
            $IOS_CRASH_FLAG \
            $BENCH_RUNNER_FLAG

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-dashboard-${{ steps.month.outputs.month }}
          path: |
            shared/docs/dashboard/trends/reports/${{ steps.month.outputs.month }}.md
            shared/docs/dashboard/trends/rtf.csv
            shared/docs/dashboard/trends/crash.csv
            shared/docs/dashboard/trends/startup.csv
          retention-days: 365

      - name: Open dashboard PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BR="dashboard/${{ steps.month.outputs.month }}"
          git config user.name "asr-dashboard-bot"
          git config user.email "asr-dashboard-bot@users.noreply.github.com"
          git checkout -b "$BR"
          git add shared/docs/dashboard/trends/
          if git diff --cached --quiet; then
            echo "[dashboard] no diff to commit";
            exit 0;
          fi
          git commit -m "chore(dashboard): monthly report ${{ steps.month.outputs.month }}"
          git push -u origin "$BR"
          gh pr create \
            --title "chore(dashboard): monthly report ${{ steps.month.outputs.month }}" \
            --body "Auto-generated by ci/dashboard.yml" \
            --base main \
            --head "$BR" || true
