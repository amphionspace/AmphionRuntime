org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 离线 license 公钥（X.509 SubjectPublicKeyInfo DER 的 base64，单行、无换行）。
# ASR 与 TTS 共用 AMPHION_LICENSE_PUBLIC_KEY；空 = SDK 不武装 license（开发 / 内部构建不校验）。
# 正式交付构建必须填入真实公钥；对应私钥用 asr/tools/license/gen_keypair.py 生成，严禁进库。
# 也可改用 -PAMPHION_LICENSE_PUBLIC_KEY=... 注入，避免公钥进 VCS。
AMPHION_SDK_MAJOR=1
AMPHION_SDK_RELEASE_DATE=2026-06-23
AMPHION_LICENSE_PUBLIC_KEY=
