org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 离线 license 公钥（X.509 SubjectPublicKeyInfo DER 的 base64，单行、无换行）。
# ASR 与 TTS 共用 AMPHION_LICENSE_PUBLIC_KEY；空 = SDK 不武装 license（开发 / 内部构建不校验）。
# 正式交付构建必须填入真实公钥；对应私钥用 asr/tools/license/gen_keypair.py 生成，严禁进库。
# 也可改用 -PAMPHION_LICENSE_PUBLIC_KEY=... 注入，避免公钥进 VCS。
AMPHION_SDK_MAJOR=1
AMPHION_SDK_RELEASE_DATE=2026-06-23
# 与 asr/android/gradle.properties 及 Harmony License.ets 内置公钥完全一致（同一 P-256 密钥对）。
# 这是验签公钥（非签名私钥），进 VCS 无安全风险；签名私钥仍在 .secure/prod/（gitignore）。
# 之前此项为空导致 debug 变体未武装（BuildConfig.LICENSE_PUBLIC_KEY_B64=""），
# 交付的 debug 样例 apk 不校验 license，任何 license（含 asr-only）都能激活 TTS。
AMPHION_LICENSE_PUBLIC_KEY=MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEc5BCEdeeELgXa3tTXeM6i49o+2NslcH9FrgpAMn3o61kFEv1Xlv7fD/kYA5NnXi2eLM8l+w4wEUvPgsbiM9tCQ==
