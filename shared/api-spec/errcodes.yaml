# AmphionRuntime ASR 任务三端共享的错误码表（single source of truth）。
#
# 维护规则：
#   1. 新增码必须在本文件先写明，再到三端 SDK 同步常量定义
#   2. 已存在的码不能删；废弃用 deprecated_at 标注
#   3. CI 中：
#      - Android :sdk:test 解析本文件，校验 AsrErrorCode 常量与之一致
#      - iOS Test/AsrErrorCodeTests 校验 AsrErrorCode enum 与之一致
#      - server 启动时把本文件内嵌为常量编入二进制
#
# 字段：
#   code:           int，全局唯一
#   name:           PascalCase，三端常量名转换规则：snake_case 改 SCREAMING_SNAKE
#   category:       1xxx 配置 / 2xxx 模型 / 3xxx 运行时 / 4xxx 网络 / 5xxx 系统 / 6xxx 授权 / 9xxx native
#   message:        默认日志文案；调用方可附加细节
#   sdk_action:     SDK 收到此错误时的推荐处理（reset / retry / fallback / fatal）
#   user_facing:    建议给终端用户显示的提示（不必逐字翻译，含义对齐即可）
#   deprecated_at:  本错误码停用版本号（可选）

errors:
  # ---------- 1xxx 配置类 ----------
  - code: 1001
    name: InvalidArgument
    category: config
    message: invalid argument passed to SDK
    sdk_action: fatal
    user_facing: 内部参数错误，请联系开发者

  - code: 1002
    name: InvalidSampleRate
    category: config
    message: sample rate not supported by current model
    sdk_action: fatal
    user_facing: 录音参数与模型不匹配

  - code: 1003
    name: SdkNotInitialized
    category: config
    message: AsrSdk.start() not called before creating AsrEngine
    sdk_action: fatal
    user_facing: 应用未初始化

  # ---------- 2xxx 模型类 ----------
  - code: 2001
    name: ModelDirInvalid
    category: model
    message: modelDir does not exist or is not a directory
    sdk_action: fatal
    user_facing: 模型路径异常

  - code: 2002
    name: ModelFileMissing
    category: model
    message: required model file missing under modelDir
    sdk_action: fatal
    user_facing: 模型文件缺失，请重新下载

  - code: 2003
    name: ModelLoadFailed
    category: model
    message: native onnxruntime failed to load model
    sdk_action: fatal
    user_facing: 模型加载失败，请重启应用

  - code: 2004
    name: ModelManifestParseError
    category: model
    message: manifest.json malformed or schema mismatch
    sdk_action: fatal
    user_facing: 模型配置错误

  - code: 2005
    name: ModelTypeMismatch
    category: model
    message: manifest.model_type does not match ONNX encoder metadata signature
    sdk_action: fatal
    user_facing: 模型配置错误，请联系开发者

  # ---------- 3xxx 运行时类 ----------
  - code: 3001
    name: SessionAlreadyClosed
    category: runtime
    message: operation on closed AsrSession ignored
    sdk_action: fatal
    user_facing: 会话已结束

  - code: 3002
    name: SampleRateMismatch
    category: runtime
    message: PCM sample rate differs from session config
    sdk_action: reset
    user_facing: 录音参数错误

  - code: 3003
    name: DecodeFailed
    category: runtime
    message: decoding failed; recommend close + recreate session
    sdk_action: reset
    user_facing: 识别异常，请重试

  # ---------- 4xxx 网络类 ----------
  - code: 4001
    name: NetworkUnavailable
    category: network
    message: no network reachable for model download
    sdk_action: retry
    user_facing: 网络不可用

  - code: 4002
    name: DownloadFailed
    category: network
    message: download HTTP failed (non-2xx / timeout)
    sdk_action: retry
    user_facing: 下载失败，请检查网络

  - code: 4003
    name: Sha256Mismatch
    category: network
    message: downloaded file sha256 does not match manifest
    sdk_action: retry
    user_facing: 文件校验失败，请重试

  # ---------- 401x 评估数据上传（eval-collector） ----------
  # 这些码用于 sample app eval 模块的上传链路，把 server 返回的字符串
  # body.code（见 docs/eval/SERVER_SPEC.md §1.6）映射成全局 int code。
  # 凡是 sdk_action=fatal 的都表示重试也是同样的错，UploadScanner 应停止重试。
  - code: 4010
    name: UploadNotConfigured
    category: network
    message: upload server_url or bearer token not configured
    sdk_action: fatal
    user_facing: 未设置上传地址或令牌

  - code: 4011
    name: UploadSchemaMismatch
    category: network
    message: server rejected upload with SCHEMA_MISMATCH; client schema_version unsupported
    sdk_action: fatal
    user_facing: 客户端版本过旧，请升级 App

  - code: 4012
    name: UploadUnauthorized
    category: network
    message: upload rejected with 401; token invalid or expired
    sdk_action: fatal
    user_facing: 令牌失效，请联系工程师重新发放

  - code: 4013
    name: UploadForbidden
    category: network
    message: upload rejected with 403; tester_id mismatch or insufficient permissions
    sdk_action: fatal
    user_facing: 权限不足，请联系工程师

  - code: 4014
    name: UploadPayloadTooLarge
    category: network
    message: upload rejected with 413; recording exceeds server max body size
    sdk_action: fatal
    user_facing: 录音文件过大，请缩短录音

  - code: 4015
    name: UploadUnsupportedMediaType
    category: network
    message: upload rejected with 415; multipart part has wrong Content-Type
    sdk_action: fatal
    user_facing: 客户端打包格式异常，请联系工程师

  # ---------- 5xxx 系统类 ----------
  - code: 5001
    name: IoFailed
    category: system
    message: local IO failed (permission / disk error)
    sdk_action: fatal
    user_facing: 设备 IO 异常

  - code: 5002
    name: StorageInsufficient
    category: system
    message: not enough storage to download / extract model
    sdk_action: fatal
    user_facing: 存储空间不足

  # ---------- 6xxx 授权类（离线 license；仅端侧 SDK 使用，server 端不涉及） ----------
  # 装机 license 离线验签失败的归一错误码。SDK 武装 license（构建期注入公钥）后，
  # AmphionRuntime.init 在 ENFORCE 模式下遇到以下错误会抛 IllegalStateException(code=...)。
  - code: 6001
    name: LicenseMissing
    category: license
    message: no license provided (options.license empty and asset not found)
    sdk_action: fatal
    user_facing: 缺少授权文件，请联系供应商

  - code: 6002
    name: LicenseMalformed
    category: license
    message: license payload is not valid JSON or required fields missing
    sdk_action: fatal
    user_facing: 授权文件损坏，请重新获取

  - code: 6003
    name: LicenseSignatureInvalid
    category: license
    message: ECDSA signature verification failed against built-in public key
    sdk_action: fatal
    user_facing: 授权文件无效，请联系供应商

  - code: 6004
    name: LicenseAppMismatch
    category: license
    message: license applicationId does not match host app packageName
    sdk_action: fatal
    user_facing: 授权与当前应用不匹配

  - code: 6005
    name: LicenseCertMismatch
    category: license
    message: license certSha256 does not match host app signing certificate
    sdk_action: fatal
    user_facing: 授权与当前应用签名不匹配

  - code: 6006
    name: LicenseExpired
    category: license
    message: license expiresAt is in the past (beyond grace period)
    sdk_action: fatal
    user_facing: 授权已过期，请续期

  - code: 6007
    name: LicenseDeviceMismatch
    category: license
    message: license deviceSha256 does not match this device
    sdk_action: fatal
    user_facing: 授权与当前设备不匹配（单机绑定）

  # ---------- 9xxx native 兜底 ----------
  - code: 9001
    name: NativeCrash
    category: native
    message: native call raised; session must be closed and recreated
    sdk_action: reset
    user_facing: 内部异常，请重试
