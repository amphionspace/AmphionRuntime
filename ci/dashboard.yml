name: monthly-asr-dashboard

on:
  schedule:
    - cron: "0 2 22-28 * 1"
  workflow_dispatch:
    inputs:
      month:
        description: "Target month (YYYY-MM). Defaults to today's month."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  monthly-dashboard:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve target month
        id: month
        env:
          TARGET_MONTH: ${{ inputs.month }}
        run: |
          if [ -z "$TARGET_MONTH" ]; then
            TARGET_MONTH=$(date -u +%Y-%m)
          fi
          python3 - "$TARGET_MONTH" <<'PY'
          import datetime
          import sys

          value = sys.argv[1]
          try:
              parsed = datetime.datetime.strptime(value, "%Y-%m")
          except ValueError as error:
              raise SystemExit(f"invalid month {value!r}; expected YYYY-MM") from error
          if parsed.strftime("%Y-%m") != value:
              raise SystemExit(f"invalid month {value!r}; expected YYYY-MM")
          PY
          echo "month=$TARGET_MONTH" >> "$GITHUB_OUTPUT"

      - name: Pull benchmark WAVs
        env:
          REGRESSION_OSS_URL: ${{ secrets.REGRESSION_OSS_URL }}
        run: |
          if [ -z "$REGRESSION_OSS_URL" ]; then
            echo "[dashboard] REGRESSION_OSS_URL not set, skipping WAV pull"
            exit 0
          fi
          mkdir -p shared/regression-set/wav
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --max-filesize 5368709120 \
            "$REGRESSION_OSS_URL" --output "$RUNNER_TEMP/dashboard-wav.tar.gz"
          python3 tools/ci/secure_extract_tar.py \
            "$RUNNER_TEMP/dashboard-wav.tar.gz" shared/regression-set/wav

      - name: Pull crash summaries
        env:
          ANDROID_CRASH_URL: ${{ secrets.ANDROID_CRASH_JSON_URL }}
          BENCH_JSON_URL: ${{ secrets.BENCH_JSON_URL }}
          IOS_CRASH_URL: ${{ secrets.IOS_CRASH_JSON_URL }}
        run: |
          mkdir -p build/dashboard
          if [ -n "$ANDROID_CRASH_URL" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
              --max-filesize 52428800 \
              "$ANDROID_CRASH_URL" --output build/dashboard/android-crash.json
          fi
          if [ -n "$IOS_CRASH_URL" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
              --max-filesize 52428800 \
              "$IOS_CRASH_URL" --output build/dashboard/ios-crash.json
          fi
          if [ -n "$BENCH_JSON_URL" ]; then
            curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
              --max-filesize 52428800 \
              "$BENCH_JSON_URL" --output build/dashboard/bench.json
          fi

      - name: Generate monthly dashboard report
        env:
          TARGET_MONTH: ${{ steps.month.outputs.month }}
        run: |
          dashboard_args=(
            --month "$TARGET_MONTH"
            --out "shared/docs/dashboard/trends/reports/$TARGET_MONTH.md"
          )
          if [ -f build/dashboard/android-crash.json ]; then
            dashboard_args+=(--android-crash-source build/dashboard/android-crash.json)
          fi
          if [ -f build/dashboard/ios-crash.json ]; then
            dashboard_args+=(--ios-crash-source build/dashboard/ios-crash.json)
          fi
          if [ -f build/dashboard/bench.json ]; then
            dashboard_args+=(--bench-source build/dashboard/bench.json)
          fi
          python shared/docs/dashboard/runner.py "${dashboard_args[@]}"

      - name: Upload private dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-dashboard-${{ steps.month.outputs.month }}
          path: |
            shared/docs/dashboard/trends/reports/${{ steps.month.outputs.month }}.md
            shared/docs/dashboard/trends/rtf.csv
            shared/docs/dashboard/trends/crash.csv
            shared/docs/dashboard/trends/startup.csv
          if-no-files-found: error
          retention-days: 30
